<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Dynamic Favicons for Light and Dark Themes -->
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" id="favicon-tag" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/favicon-light.png" />
    <script>
      (function() {
        function setFavicon() {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var link = document.getElementById('favicon-tag');
          if (link) {
            link.href = isDark ? '/favicon-dark.png' : '/favicon-light.png';
          }
        }
        setFavicon();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setFavicon);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forster Kwarteng Foundation | Empowering Lives, Building Futures</title>
    <meta name="description" content="FORSTER KWARTENG FOUNDATION is a non profit organization established to empower individuals and communities through education, mentorship, skills development and sustainable social interventions across Ghana." />
    <meta name="theme-color" content="#000080" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-amber-300 selection:text-blue-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
